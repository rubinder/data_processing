[project]
name = "flink-applications"
version = "0.1.0"
description = "PyFlink data processing jobs"
requires-python = ">=3.10"
dependencies = [
    "apache-flink==1.18.1",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
