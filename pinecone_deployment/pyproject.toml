[project]
name = "pinecone-deployment"
version = "0.1.0"
description = "Pinecone similar-conversation retrieval for the AI agent conversation events"
requires-python = ">=3.10"
dependencies = [
    # 7.x: the newest line Pinecone Local understands. The 10.x client sends the
    # 2025-10 control-plane body (vector_type/spec layout) and the emulator
    # rejects it with "missing field dimension".
    "pinecone>=7.0.0,<8",
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
# Tests and benchmarks run against Pinecone Local (docker) with the built-in
# hashing embedder: no account, no model download, no bill.
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
# Real dense embeddings on your own machine (sentence-transformers pulls torch).
local-embeddings = [
    "sentence-transformers>=2.7.0",
]
# BM25 sparse vectors for hybrid search.
hybrid = [
    "pinecone-text>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pinecone_deployment"]
