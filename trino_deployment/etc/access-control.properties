# File-based system access control: the rules in access-control-rules.json.
# The MCP server connects as `mcp_reader`, which these rules make read-only
# on every catalog at the Trino layer, on top of the PostgreSQL role of the
# same name underneath the postgres_gold catalog.
access-control.name=file
security.config-file=/etc/trino/access-control-rules.json
