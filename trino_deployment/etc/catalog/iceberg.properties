# The same REST catalog and S3 bucket ../iceberg_deployment's Spark session
# uses in ICEBERG_CATALOG_TYPE=rest mode, so a table written by either engine
# is readable by the other.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://warehouse/
fs.native-s3.enabled=true
s3.endpoint=http://iceberg-s3:9000
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=${ENV:ICEBERG_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:ICEBERG_S3_SECRET_KEY}
