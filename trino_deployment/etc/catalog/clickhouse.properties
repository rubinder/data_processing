# The two-shard cluster from ../clickhouse_deployment, through its first
# node; default.impressions is the Distributed table, so reads and writes fan
# out across both shards from here. The `trino` user exists because the
# image's `default` user only accepts localhost connections.
connector.name=clickhouse
# distributed_foreground_insert (ClickHouse 24.x name of insert_distributed_sync):
# the shards accept the rows before the INSERT returns, so a count right
# after it is the real count and a re-seed cannot race an async queue.
connection-url=jdbc:clickhouse://clickhouse-01:8123/?distributed_foreground_insert=1
connection-user=trino
connection-password=${ENV:CLICKHOUSE_TRINO_PASSWORD}
# ClickHouse String is bytes; without this the connector exposes it as
# varbinary and an INSERT ... SELECT of varchar columns is a type mismatch.
clickhouse.map-string-as-varchar=true
# Write straight into the target. The default path stages rows in a
# temporary table created `AS default.impressions`, which copies the
# Distributed engine: the staging table itself scatters rows onto the shards
# and the final INSERT ... SELECT re-reads them, so a 3,000-row insert landed
# 4,000 to 5,000 rows. Measured in system.query_log; see the README.
insert.non-transactional-insert.enabled=true
