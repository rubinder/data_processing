# The raw layer, through the ingestion role: SELECT on raw.* and nothing else.
connector.name=postgresql
connection-url=jdbc:postgresql://dbt-postgres:5432/data_processing
connection-user=ingestion
connection-password=${ENV:INGESTION_PASSWORD}
# dbt's round(x, 2) produces unbounded `numeric`, which the connector hides
# by default (it cannot size a Trino decimal for it). Map it to decimal(38,2)
# with explicit rounding so every gold column is visible.
decimal-mapping=allow_overflow
decimal-default-scale=2
decimal-rounding-mode=HALF_UP
