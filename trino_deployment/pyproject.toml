[project]
name = "trino-deployment"
version = "0.1.0"
description = "Trino as a federated query engine over the Iceberg REST catalog and the dbt PostgreSQL gold layer"
requires-python = ">=3.10"
dependencies = [
    "trino>=0.330.0",
    # Native PostgreSQL timings in the benchmark, for comparison.
    "psycopg[binary]>=3.1.0",
    # Only for the synthetic seed: the same impression generator every
    # other module uses. Imports no Spark.
    "iceberg-deployment",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[tool.uv.sources]
iceberg-deployment = { path = "../iceberg_deployment", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trino_deployment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["trino: needs the Trino, Iceberg REST/MinIO and dbt PostgreSQL containers running"]
