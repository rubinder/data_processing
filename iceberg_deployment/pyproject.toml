[project]
name = "iceberg-deployment"
version = "0.1.0"
description = "Apache Iceberg lakehouse tables on Spark 3.5"
requires-python = ">=3.10"
dependencies = [
    "pyspark==3.5.4",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iceberg_deployment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
