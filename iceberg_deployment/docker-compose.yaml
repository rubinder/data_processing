# Iceberg REST catalog + MinIO (S3-compatible object storage).
#
# The tests use the filesystem ("hadoop") catalog, which needs no services but
# relies on atomic rename for commits -- fine locally, unsafe on object stores.
# This stack is the shape a real deployment takes: a REST catalog owns commit
# atomicity, and storage is S3.
#
# Ports are offset from the other modules in this repo so it can run alongside
# them on the shared data-processing-network.

services:
  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: iceberg-rest
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://iceberg-minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    depends_on:
      iceberg-minio:
        condition: service_healthy
    networks:
      - data-processing-network

  iceberg-minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: iceberg-minio
    hostname: iceberg-minio
    command: server /data --console-address ":9101"
    ports:
      - "9100:9000"
      - "9101:9101"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - iceberg-minio-data:/data
    networks:
      - data-processing-network

  # One-shot: create the warehouse bucket the REST catalog expects.
  iceberg-minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      iceberg-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://iceberg-minio:9000
      $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/warehouse &&
      echo 'warehouse bucket ready'"
    networks:
      - data-processing-network

volumes:
  iceberg-minio-data:

networks:
  data-processing-network:
    external: true
    name: data-processing-network
