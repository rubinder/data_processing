[project]
name = "mcp-deployment"
version = "0.1.0"
description = "Governed agent access to the gold layer: RBAC, blue-green promotion, a pgvector catalog and an MCP server that runs only approved templates"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary,pool]>=3.1.0",
    "pyyaml>=6.0",
    # 1.x: the FastMCP API. 2.x renamed it to MCPServer and changed call shapes.
    "mcp>=1.10.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]
# A real semantic embedder for the catalog. The default is a dependency-free
# hashing embedder, which is lexical: good enough to make ranking observable
# in tests, not good enough to match a paraphrase that shares no words.
semantic = ["sentence-transformers>=2.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_deployment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: needs the dbt PostgreSQL (pgvector) from ../dbt_deployment running"]
