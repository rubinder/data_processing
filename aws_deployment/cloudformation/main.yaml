AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Data processing pipeline - S3 landing, Lambda, Step Function, Batch, Glue,
  Athena workgroup, EMR, DynamoDB. Cost-aware defaults: see ../FINOPS.md.

# ------------------------------------------------------------------
# Cost / observability notes for this template (long form in FINOPS.md)
#
# * Every taggable resource carries Project / Environment / CostCenter so
#   Cost Explorer can be grouped by them (activate the three keys as
#   cost-allocation tags in Billing once, they are not retroactive).
# * S3 lifecycle rules tier raw data down and expire scratch prefixes.
# * The Athena workgroup enforces a per-query scanned-bytes cutoff and
#   publishes ProcessedBytes to CloudWatch.
# * The Glue job runs Glue 5.0 (Spark 3.5) with auto scaling, zstd parquet
#   and dynamic partition overwrite, mirroring spark_applications.
# * The EMR cluster keeps master/core on demand, puts task nodes on Spot,
#   scales with a managed policy and self-terminates when idle.
# * OpenLineage is wired into both Glue and EMR behind one parameter.
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: data-processing
    Description: Project name used as prefix for resource names

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment; used in names and cost-allocation tags

  CostCenter:
    Type: String
    Default: data-platform
    Description: Cost-allocation tag value applied to every taggable resource

  DeploymentBucket:
    Type: String
    Description: S3 bucket containing deployment artifacts (Lambda zip, Glue scripts, jars)

  LambdaS3Key:
    Type: String
    Default: deployment/lambda.zip
    Description: S3 key for Lambda deployment package

  GlueScriptS3Key:
    Type: String
    Default: deployment/etl_job.py
    Description: S3 key for Glue ETL script

  BatchJobImage:
    Type: String
    Description: ECR image URI for the Batch encoding check job

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for the Batch compute environment security group

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs for Batch compute environment and EMR cluster

  EmrKeyPair:
    Type: String
    Default: ""
    Description: EC2 key pair name for EMR instances (optional)

  BucketVersioning:
    Type: String
    Default: Suspended
    AllowedValues: [Enabled, Suspended]
    Description: >-
      Versioning on the landing and processed buckets. Dynamic partition
      overwrite rewrites partition files, so with versioning on every
      re-run leaves noncurrent copies behind; the lifecycle rules expire
      those after 14 days to bound the cost.

  # ---- Glue ----------------------------------------------------------
  GlueVersion:
    Type: String
    Default: "5.0"
    AllowedValues: ["4.0", "5.0", "5.1"]
    Description: >-
      Glue runtime. 5.0 = Spark 3.5.4 / Python 3.11 (matches the project's
      Spark 3.5 baseline); 5.1 = Spark 3.5.6; 4.0 = Spark 3.3 (legacy).

  GlueNumberOfWorkers:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 299
    Description: >-
      Upper bound on G.1X workers. With --enable-auto-scaling this is the
      ceiling, not the fixed allocation; Glue bills per worker actually used.

  GlueJobTimeoutMinutes:
    Type: Number
    Default: 60
    MinValue: 1
    Description: Job run timeout in minutes (a stuck run is a DPU-hour leak)

  GlueMaxConcurrentRuns:
    Type: Number
    Default: 1
    MinValue: 1
    Description: >-
      Max concurrent runs. Kept at 1 by default because two concurrent runs
      writing the same (page_type, date, hour) partition with dynamic
      overwrite would race; the state machine retries on
      ConcurrentRunsExceededException instead.

  # ---- Athena --------------------------------------------------------
  AthenaBytesScannedCutoffBytes:
    Type: Number
    Default: 10737418240
    MinValue: 10485760
    Description: >-
      Per-query scanned-bytes cutoff enforced by the workgroup, in bytes.
      Default 10 GiB. Athena's own floor is 10 MiB (10485760).

  # ---- EMR -----------------------------------------------------------
  EmrReleaseLabel:
    Type: String
    Default: emr-7.13.0
    Description: >-
      EMR release. emr-7.13.0 ships Spark 3.5.6; any emr-7.x release is on
      the Spark 3.5 line.

  EmrInstanceType:
    Type: String
    Default: m5.xlarge
    Description: Instance type for master, core and task nodes

  EmrCoreInstanceCount:
    Type: Number
    Default: 2
    MinValue: 1
    Description: On-demand core nodes (HDFS + compute). This is also the managed-scaling on-demand ceiling.

  EmrTaskInstanceCount:
    Type: Number
    Default: 1
    MinValue: 0
    Description: Initial Spot task nodes (compute only, no HDFS; safe to lose)

  EmrManagedScalingMinUnits:
    Type: Number
    Default: 2
    MinValue: 1
    Description: Managed scaling floor, in instances (core + task)

  EmrManagedScalingMaxUnits:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Managed scaling ceiling, in instances (core + task)

  EmrIdleTimeoutSeconds:
    Type: Number
    Default: 3600
    MinValue: 60
    MaxValue: 604800
    Description: Auto-terminate the cluster after this many idle seconds

  # ---- OpenLineage ---------------------------------------------------
  OpenLineageUrl:
    Type: String
    Default: ""
    Description: >-
      OpenLineage HTTP endpoint (e.g. Marquez: http://host:5000). Empty
      disables lineage emission on both Glue and EMR.

  EmrBootstrapScriptKey:
    Type: String
    Default: ""
    Description: >-
      S3 key (in DeploymentBucket) of an EMR bootstrap script, e.g.
      deployment/bootstrap_python311.sh, which installs Python 3.11 so the
      Python 3.10-baseline spark_applications jobs run on EMR 7.x (Python 3.9
      default). Empty disables the bootstrap and the interpreter override.
  OpenLineageSparkVersion:
    Type: String
    Default: 1.53.0
    Description: >-
      io.openlineage:openlineage-spark_2.12 version. Glue loads the jar from
      s3://<DeploymentBucket>/deployment/jars/openlineage-spark_2.12-<version>.jar
      (deploy.sh uploads it); EMR resolves it via spark.jars.packages.

Conditions:
  HasOpenLineage: !Not [!Equals [!Ref OpenLineageUrl, ""]]
  HasEmrKeyPair: !Not [!Equals [!Ref EmrKeyPair, ""]]
  HasEmrBootstrap: !Not [!Equals [!Ref EmrBootstrapScriptKey, ""]]

Resources:
  # ============================================================
  # S3 Buckets
  # ============================================================

  DataLandingBucket:
    Type: AWS::S3::Bucket
    DependsOn: LambdaInvokePermission
    Properties:
      BucketName: !Sub "${ProjectName}-landing-${AWS::AccountId}"
      VersioningConfiguration:
        Status: !Ref BucketVersioning
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt TriggerStepFunctionLambda.Arn
      LifecycleConfiguration:
        Rules:
          # Raw uploads are read once by the pipeline and then only for
          # replays. IA after 30 days cuts storage price roughly in half for
          # rarely-read data; GLACIER_IR after 90 days cuts it again while
          # keeping millisecond retrieval (no restore step) so a backfill
          # can still read the object directly. Both classes add per-GB
          # retrieval fees and a minimum storage duration, and S3 does not
          # transition objects under 128 KB to IA, so tiny files stay in
          # STANDARD; see FINOPS.md for the trade-off.
          - Id: raw-tier-down
            Status: Enabled
            Prefix: raw/
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
              - StorageClass: GLACIER_IR
                TransitionInDays: 90
          # Failed multipart uploads leave invisible, billed parts behind.
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          # No-op while versioning is Suspended; bounds the cost of
          # overwritten copies when it is Enabled.
          - Id: expire-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 14
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: CostCenter
          Value: !Ref CostCenter

  ProcessedDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-processed-${AWS::AccountId}"
      VersioningConfiguration:
        Status: !Ref BucketVersioning
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          # Processed parquet has an unpredictable access pattern (recent
          # partitions are hot for Athena/dbt, old ones go cold). Intelligent
          # Tiering moves objects between tiers on observed access with no
          # retrieval fee, at the price of a small per-object monitoring
          # charge, so it is the right default for a partitioned table with
          # many mid-sized files. Delayed 30 days so the first month of
          # (certainly hot) access is not paying the monitoring fee.
          - Id: processed-intelligent-tiering
            Status: Enabled
            Prefix: processed/
            Transitions:
              - StorageClass: INTELLIGENT_TIERING
                TransitionInDays: 30
          # Quarantined rows exist to be inspected and re-ingested; after a
          # quarter nobody will, so expire them.
          - Id: expire-quarantine
            Status: Enabled
            Prefix: quarantine/
            ExpirationInDays: 90
          # Athena result sets are scratch. Keep a week for re-download.
          - Id: expire-athena-results
            Status: Enabled
            Prefix: athena-results/
            ExpirationInDays: 7
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          # Dynamic partition overwrite deletes and rewrites partition files
          # on every re-run; with versioning on these become noncurrent
          # versions that are billed until expired.
          - Id: expire-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 14
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: CostCenter
          Value: !Ref CostCenter

  # ============================================================
  # IAM Roles
  # ============================================================

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: StepFunctionStartExecution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref DataProcessingStateMachine
        - PolicyName: S3ReadAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectName}-landing-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::${ProjectName}-landing-${AWS::AccountId}/*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: CostCenter
          Value: !Ref CostCenter

  StepFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-sfn-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - batch:SubmitJob
                  - batch:DescribeJobs
                  - batch:TerminateJob
                Resource: "*"
              - Effect: Allow
                Action:
                  - glue:StartCrawler
                  - glue:GetCrawler
                  - glue:StartJobRun
                  - glue:GetJobRun
                  - glue:GetJobRuns
                  - glue:BatchStopJobRun
                Resource: "*"
              - Effect: Allow
                Action:
                  - events:PutTargets
                  - events:PutRule
                  - events:DescribeRule
                Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForBatchJobsRule"
              - Effect: Allow
                Action:
                  - events:PutTargets
                  - events:PutRule
                  - events:DescribeRule
                Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForGlueJobRunsRule"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: CostCenter
          Value: !Ref CostCenter

  GlueCrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-glue-crawler-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectName}-landing-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::${ProjectName}-landing-${AWS::AccountId}/*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: CostCenter
          Value: !Ref CostCenter

  GlueETLJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-glue-etl-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: S3ReadWriteAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectName}-landing-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::${ProjectName}-landing-${AWS::AccountId}/*"
              # DeleteObject is required by dynamic partition overwrite: the
              # existing files of each touched partition are removed before
              # the new ones land.
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectName}-processed-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::${ProjectName}-processed-${AWS::AccountId}/*"
        - PolicyName: GlueScriptAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "arn:aws:s3:::${DeploymentBucket}/${GlueScriptS3Key}"
                  - !Sub "arn:aws:s3:::${DeploymentBucket}/deployment/jars/*"
              # --TempDir and --spark-event-logs-path live in the deployment
              # bucket and need read/write.
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "arn:aws:s3:::${DeploymentBucket}/glue-temp/*"
                  - !Sub "arn:aws:s3:::${DeploymentBucket}/glue-spark-events/*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${DeploymentBucket}"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: CostCenter
          Value: !Ref CostCenter

  BatchJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-batch-job-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: S3ReadAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectName}-landing-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::${ProjectName}-landing-${AWS::AccountId}/*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: CostCenter
          Value: !Ref CostCenter

  EMRServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-emr-service-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: elasticmapreduce.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEMRServicePolicy_v2
      # AmazonEMRServicePolicy_v2 only permits EC2 provisioning on VPCs,
      # subnets and security groups tagged
      # for-use-with-amazon-emr-managed-policies=true. This template does
      # not own the VPC/subnets it is given, so a first deployment failed
      # with "Service role ... has insufficient EC2 permissions ...
      # ec2:CreateSecurityGroup". The inline policy grants the provisioning
      # actions the legacy AmazonElasticMapReduceRole carried, without the
      # tag precondition; scope it down (or tag the network and drop it)
      # once the network is owned by infrastructure code.
      Policies:
        - PolicyName: EmrEc2Provisioning
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:CancelSpotInstanceRequests
                  - ec2:CreateFleet
                  - ec2:CreateLaunchTemplate
                  - ec2:CreateLaunchTemplateVersion
                  - ec2:CreateNetworkInterface
                  - ec2:CreateSecurityGroup
                  - ec2:CreateTags
                  - ec2:DeleteLaunchTemplate
                  - ec2:DeleteNetworkInterface
                  - ec2:DeleteSecurityGroup
                  - ec2:DeleteTags
                  - ec2:Describe*
                  - ec2:DetachNetworkInterface
                  - ec2:ModifyImageAttribute
                  - ec2:ModifyInstanceAttribute
                  - ec2:RequestSpotInstances
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RunInstances
                  - ec2:TerminateInstances
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListInstanceProfiles
                  - iam:ListRolePolicies
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt EMRInstanceRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringLike:
                    iam:AWSServiceName:
                      - spot.amazonaws.com
                      - elasticmapreduce.amazonaws.com.cn
                      - elasticmapreduce.amazonaws.com
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: CostCenter
          Value: !Ref CostCenter

  EMRInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-emr-instance-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonElasticMapReduceforEC2Role
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectName}-landing-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::${ProjectName}-landing-${AWS::AccountId}/*"
                  - !Sub "arn:aws:s3:::${ProjectName}-processed-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::${ProjectName}-processed-${AWS::AccountId}/*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: CostCenter
          Value: !Ref CostCenter

  EMRInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${ProjectName}-emr-instance-profile"
      Roles:
        - !Ref EMRInstanceRole

  # ============================================================
  # Lambda
  # ============================================================

  TriggerStepFunctionLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-trigger-sfn"
      Runtime: python3.10
      Handler: trigger_step_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref DeploymentBucket
        S3Key: !Ref LambdaS3Key
      Timeout: 60
      MemorySize: 128
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref DataProcessingStateMachine
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: CostCenter
          Value: !Ref CostCenter

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt TriggerStepFunctionLambda.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::${ProjectName}-landing-${AWS::AccountId}"

  # ============================================================
  # Step Function
  # ============================================================

  DataProcessingStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${ProjectName}-pipeline"
      RoleArn: !GetAtt StepFunctionExecutionRole.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: CostCenter
          Value: !Ref CostCenter
      DefinitionString: !Sub |
        {
          "Comment": "Data processing pipeline: encoding check -> crawler -> ETL. The crawler is addressed by its fixed name, not !Ref, so the crawler can depend on the landing bucket without closing the bucket->notification->lambda->state-machine cycle.",
          "StartAt": "CheckEncoding",
          "States": {
            "CheckEncoding": {
              "Type": "Task",
              "Resource": "arn:aws:states:::batch:submitJob.sync",
              "Parameters": {
                "JobName": "check-encoding",
                "JobDefinition": "${EncodingCheckJobDefinition}",
                "JobQueue": "${BatchJobQueue}",
                "ContainerOverrides": {
                  "Environment": [
                    {"Name": "S3_BUCKET", "Value.$": "$.bucket"},
                    {"Name": "S3_KEY", "Value.$": "$.key"}
                  ]
                }
              },
              "ResultPath": "$.encodingResult",
              "Next": "RunGlueCrawler"
            },
            "RunGlueCrawler": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:glue:startCrawler",
              "Parameters": {
                "Name": "${ProjectName}-crawler"
              },
              "ResultPath": "$.crawlerResult",
              "Next": "WaitForCrawler"
            },
            "WaitForCrawler": {
              "Type": "Wait",
              "Seconds": 30,
              "Next": "CheckCrawlerStatus"
            },
            "CheckCrawlerStatus": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:glue:getCrawler",
              "Parameters": {
                "Name": "${ProjectName}-crawler"
              },
              "ResultPath": "$.crawlerStatus",
              "Next": "IsCrawlerDone"
            },
            "IsCrawlerDone": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.crawlerStatus.Crawler.State",
                  "StringEquals": "READY",
                  "Next": "RunGlueETL"
                }
              ],
              "Default": "WaitForCrawler"
            },
            "RunGlueETL": {
              "Type": "Task",
              "Resource": "arn:aws:states:::glue:startJobRun.sync",
              "Parameters": {
                "JobName": "${GlueETLJob}",
                "Arguments": {
                  "--source_bucket.$": "$.bucket",
                  "--source_key.$": "$.key",
                  "--target_bucket": "${ProjectName}-processed-${AWS::AccountId}",
                  "--database_name": "${ProjectName}_db",
                  "--table_name": "processed_data",
                  "--run_id.$": "$$.Execution.Name"
                }
              },
              "Retry": [
                {
                  "ErrorEquals": ["Glue.ConcurrentRunsExceededException"],
                  "IntervalSeconds": 60,
                  "MaxAttempts": 20,
                  "BackoffRate": 1.5,
                  "MaxDelaySeconds": 600,
                  "JitterStrategy": "FULL"
                }
              ],
              "End": true
            }
          }
        }

  # ============================================================
  # Glue
  # ============================================================

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub "${ProjectName}_db"
        Description: Data processing pipeline database

  DataCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub "${ProjectName}-crawler"
      Role: !GetAtt GlueCrawlerRole.Arn
      DatabaseName: !Ref GlueDatabase
      Targets:
        S3Targets:
          # !Ref (not the reconstructed name) so CloudFormation orders the
          # crawler after the bucket: Glue validates the S3 target at create
          # time and fails with 404 if the bucket does not exist yet. The
          # IAM policies and the S3 notification keep the reconstructed name
          # because referencing the bucket there would be circular.
          - Path: !Sub "s3://${DataLandingBucket}/"
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        CostCenter: !Ref CostCenter

  GlueETLJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub "${ProjectName}-etl"
      Description: Raw impression CSV -> partitioned zstd parquet (see glue/etl_job.py)
      Role: !GetAtt GlueETLJobRole.Arn
      GlueVersion: !Ref GlueVersion
      Command:
        Name: glueetl
        ScriptLocation: !Sub "s3://${DeploymentBucket}/${GlueScriptS3Key}"
        PythonVersion: "3"
      # G.1X = 1 DPU (4 vCPU / 16 GB). NumberOfWorkers is the auto-scaling
      # ceiling; the driver always occupies one worker.
      WorkerType: G.1X
      NumberOfWorkers: !Ref GlueNumberOfWorkers
      Timeout: !Ref GlueJobTimeoutMinutes
      # One retry covers transient S3/Spot-like failures; the job is
      # idempotent (dynamic partition overwrite) so a retry cannot duplicate.
      MaxRetries: 1
      ExecutionProperty:
        MaxConcurrentRuns: !Ref GlueMaxConcurrentRuns
      DefaultArguments:
        "--job-language": python
        "--TempDir": !Sub "s3://${DeploymentBucket}/glue-temp/"
        # Bookmarks only track sources read through GlueContext with a
        # transformation_ctx; this job reads a single, explicitly named
        # object per run with spark.read, so the bookmark is inert today.
        # Enabling it now means switching a source to a DynamicFrame later
        # is a script-only change.
        "--job-bookmark-option": job-bookmark-enable
        # Per-worker billing: Glue adds/removes executors with load and
        # bills the workers actually running, capped at NumberOfWorkers.
        "--enable-auto-scaling": "true"
        # glue.driver.* / glue.ALL.* metrics in CloudWatch, incl. the
        # aggregate task and byte counters FINOPS.md reads.
        "--enable-metrics": "true"
        # Worker utilisation, skew and error-class metrics per run.
        "--enable-observability-metrics": "true"
        "--enable-continuous-cloudwatch-log": "true"
        # Spark history events for the DEBUGGING.md plan analysis workflow.
        "--enable-spark-ui": "true"
        "--spark-event-logs-path": !Sub "s3://${DeploymentBucket}/glue-spark-events/"
        # Glue copies these S3 jars to the driver and executors' classpath.
        # Glue cannot resolve Maven coordinates, hence the S3 path; deploy.sh
        # uploads the jar when OPENLINEAGE_URL is set.
        "--extra-jars": !If
          - HasOpenLineage
          - !Sub "s3://${DeploymentBucket}/deployment/jars/openlineage-spark_2.12-${OpenLineageSparkVersion}.jar"
          - !Ref AWS::NoValue
        # Glue exposes exactly one "--conf" job parameter. Multiple Spark
        # settings are passed as a single value in which each additional
        # setting is prefixed by a literal " --conf ", i.e.
        #   "k1=v1 --conf k2=v2 --conf k3=v3"
        # Glue splits this string back into individual spark-submit --conf
        # flags. This is the pattern AWS's own Iceberg/Hudi/Delta docs use;
        # passing several "--conf" keys in the map is impossible (duplicate
        # key) and comma-separating them does not work.
        #
        # zstd parquet: smaller files than snappy at a modest CPU cost, and
        # bytes written here are bytes Athena scans later (FINOPS.md).
        # Dynamic partition overwrite: re-running a file rewrites only the
        # partitions it contains (DECISIONS.md #2). Partition column type
        # inference off: deterministic partition typing on read-back.
        "--conf": !If
          - HasOpenLineage
          - !Sub >-
            spark.sql.parquet.compression.codec=zstd
            --conf spark.sql.sources.partitionOverwriteMode=dynamic
            --conf spark.sql.sources.partitionColumnTypeInference.enabled=false
            --conf spark.extraListeners=io.openlineage.spark.agent.OpenLineageSparkListener
            --conf spark.openlineage.transport.type=http
            --conf spark.openlineage.transport.url=${OpenLineageUrl}
            --conf spark.openlineage.namespace=${ProjectName}
          - >-
            spark.sql.parquet.compression.codec=zstd
            --conf spark.sql.sources.partitionOverwriteMode=dynamic
            --conf spark.sql.sources.partitionColumnTypeInference.enabled=false
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        CostCenter: !Ref CostCenter

  # ============================================================
  # Athena
  # ============================================================

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "${ProjectName}-${Environment}"
      Description: >-
        Workgroup for the processed data lake. Enforces a per-query scanned
        bytes cutoff and publishes ProcessedBytes to CloudWatch.
      State: ENABLED
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        # Client-side settings (result location, engine) cannot override
        # the workgroup; this is what makes the cutoff a real guardrail.
        EnforceWorkGroupConfiguration: true
        # CloudWatch AWS/Athena ProcessedBytes / TotalExecutionTime per
        # workgroup; the primary before/after signal for pruning changes.
        PublishCloudWatchMetricsEnabled: true
        # Athena bills per byte scanned; a query that would scan more than
        # this is cancelled instead of billed. Size it to the largest
        # legitimate full-table scan plus headroom.
        BytesScannedCutoffPerQuery: !Ref AthenaBytesScannedCutoffBytes
        EngineVersion:
          SelectedEngineVersion: Athena engine version 3
        ResultConfiguration:
          OutputLocation: !Sub "s3://${ProcessedDataBucket}/athena-results/"
          EncryptionConfiguration:
            EncryptionOption: SSE_S3
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: CostCenter
          Value: !Ref CostCenter

  # ============================================================
  # Batch (Fargate)
  # ============================================================

  BatchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Egress-only security group for the Batch Fargate encoding check
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Outbound to S3 and ECR
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: CostCenter
          Value: !Ref CostCenter

  BatchComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: !Sub "${ProjectName}-compute-env"
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: FARGATE
        MaxvCpus: 4
        Subnets: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref BatchSecurityGroup
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        CostCenter: !Ref CostCenter

  BatchJobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: !Sub "${ProjectName}-job-queue"
      State: ENABLED
      Priority: 1
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref BatchComputeEnvironment
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        CostCenter: !Ref CostCenter

  EncodingCheckJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: !Sub "${ProjectName}-encoding-check"
      Type: container
      PlatformCapabilities:
        - FARGATE
      ContainerProperties:
        Image: !Ref BatchJobImage
        ResourceRequirements:
          - Type: VCPU
            Value: "0.25"
          - Type: MEMORY
            Value: "512"
        ExecutionRoleArn: !GetAtt BatchJobRole.Arn
        JobRoleArn: !GetAtt BatchJobRole.Arn
        # Fargate tasks in a public subnet have no route to ECR / S3 / logs
        # without a public IP (there is no NAT gateway in the given VPC).
        # First deployment failed with "ResourceInitializationError: unable
        # to pull secrets or registry auth ... dial tcp ... i/o timeout".
        # For private subnets behind a NAT set this to DISABLED.
        NetworkConfiguration:
          AssignPublicIp: ENABLED
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        CostCenter: !Ref CostCenter

  # ============================================================
  # EMR Cluster
  # ============================================================

  EMRCluster:
    Type: AWS::EMR::Cluster
    Properties:
      Name: !Sub "${ProjectName}-emr-cluster"
      ReleaseLabel: !Ref EmrReleaseLabel
      Applications:
        - Name: Spark
      ServiceRole: !Ref EMRServiceRole
      JobFlowRole: !Ref EMRInstanceProfile
      LogUri: !Sub "s3://${DeploymentBucket}/emr-logs/"
      VisibleToAllUsers: true
      # Lets two independent spark-submit steps share the cluster instead
      # of queueing; only meaningful with ActionOnFailure CONTINUE.
      StepConcurrencyLevel: 2
      # A long-lived cluster with nothing to do is the single biggest EMR
      # cost leak. Terminate after the idle window; a scheduled job would
      # recreate the cluster (or move to EMR Serverless).
      AutoTerminationPolicy:
        IdleTimeout: !Ref EmrIdleTimeoutSeconds
      # Managed scaling adds/removes nodes on YARN memory pressure.
      # MaximumOnDemandCapacityUnits == core count means every unit above
      # the core floor is Spot; MaximumCoreCapacityUnits == core count means
      # scaling only ever adds task nodes (no HDFS rebalancing on scale-in).
      ManagedScalingPolicy:
        ComputeLimits:
          UnitType: Instances
          MinimumCapacityUnits: !Ref EmrManagedScalingMinUnits
          MaximumCapacityUnits: !Ref EmrManagedScalingMaxUnits
          MaximumCoreCapacityUnits: !Ref EmrCoreInstanceCount
          MaximumOnDemandCapacityUnits: !Ref EmrCoreInstanceCount
      Instances:
        # Must be true for AutoTerminationPolicy to be the thing that ends
        # the cluster rather than "no steps" ending it at launch.
        KeepJobFlowAliveWhenNoSteps: true
        TerminationProtected: false
        # Master and core hold the driver / HDFS / shuffle data: an
        # interruption there fails the job, so they stay on demand.
        MasterInstanceGroup:
          Name: master
          InstanceCount: 1
          InstanceType: !Ref EmrInstanceType
          Market: ON_DEMAND
        CoreInstanceGroup:
          Name: core
          InstanceCount: !Ref EmrCoreInstanceCount
          InstanceType: !Ref EmrInstanceType
          Market: ON_DEMAND
        # Task nodes are stateless compute; losing one costs a task retry,
        # not the job. No BidPrice = capped at the on-demand price.
        TaskInstanceGroups:
          - Name: task-spot
            InstanceCount: !Ref EmrTaskInstanceCount
            InstanceType: !Ref EmrInstanceType
            Market: SPOT
        Ec2SubnetId: !Select [0, !Ref SubnetIds]
        Ec2KeyName: !If [HasEmrKeyPair, !Ref EmrKeyPair, !Ref AWS::NoValue]
      BootstrapActions: !If
        - HasEmrBootstrap
        - - Name: python311
            ScriptBootstrapAction:
              Path: !Sub "s3://${DeploymentBucket}/${EmrBootstrapScriptKey}"
        - !Ref AWS::NoValue
      Configurations:
        # Mirrors spark_applications/utils/session.py _COMMON_CONF so a job
        # behaves the same locally, on EMR and on Glue.
        - Classification: spark-defaults
          ConfigurationProperties:
            spark.sql.shuffle.partitions: "200"
            spark.sql.adaptive.enabled: "true"
            spark.sql.adaptive.coalescePartitions.enabled: "true"
            spark.sql.adaptive.skewJoin.enabled: "true"
            spark.sql.parquet.compression.codec: zstd
            spark.sql.sources.partitionOverwriteMode: dynamic
            spark.sql.sources.partitionColumnTypeInference.enabled: "false"
            # Interpreter installed by the bootstrap action (see
            # emr/bootstrap_python311.sh); EMR 7.x defaults to 3.9.
            spark.pyspark.python: !If
              - HasEmrBootstrap
              - /usr/bin/python3.11
              - !Ref AWS::NoValue
            spark.pyspark.driver.python: !If
              - HasEmrBootstrap
              - /usr/bin/python3.11
              - !Ref AWS::NoValue
            # OpenLineage: resolved from Maven Central at spark-submit time,
            # so cluster nodes need outbound internet (NAT) for this to
            # work. Use a bootstrap action + spark.jars if they do not.
            spark.jars.packages: !If
              - HasOpenLineage
              - !Sub "io.openlineage:openlineage-spark_2.12:${OpenLineageSparkVersion}"
              - !Ref AWS::NoValue
            spark.extraListeners: !If
              - HasOpenLineage
              - io.openlineage.spark.agent.OpenLineageSparkListener
              - !Ref AWS::NoValue
            spark.openlineage.transport.type: !If
              - HasOpenLineage
              - http
              - !Ref AWS::NoValue
            spark.openlineage.transport.url: !If
              - HasOpenLineage
              - !Ref OpenLineageUrl
              - !Ref AWS::NoValue
            spark.openlineage.namespace: !If
              - HasOpenLineage
              - !Ref ProjectName
              - !Ref AWS::NoValue
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: CostCenter
          Value: !Ref CostCenter

  # ============================================================
  # DynamoDB
  # ============================================================

  StatusTrackingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-status"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: CostCenter
          Value: !Ref CostCenter

Outputs:
  DataLandingBucketName:
    Value: !Ref DataLandingBucket
    Description: S3 bucket for incoming data files (upload under raw/ to get lifecycle tiering)

  ProcessedDataBucketName:
    Value: !Ref ProcessedDataBucket
    Description: S3 bucket for processed parquet data

  StateMachineArn:
    Value: !Ref DataProcessingStateMachine
    Description: Step Function state machine ARN

  GlueDatabaseName:
    Value: !Ref GlueDatabase
    Description: Glue catalog database name

  GlueJobName:
    Value: !Ref GlueETLJob
    Description: Glue ETL job name

  AthenaWorkGroupName:
    Value: !Ref AthenaWorkGroup
    Description: Athena workgroup to query the processed data through (enforced scanned-bytes cutoff)

  EMRClusterId:
    Value: !Ref EMRCluster
    Description: EMR cluster ID

  StatusTrackingTableName:
    Value: !Ref StatusTrackingTable
    Description: DynamoDB status tracking table name

  OpenLineageEnabled:
    Value: !If [HasOpenLineage, "true", "false"]
    Description: Whether Glue and EMR emit OpenLineage events
