version: 2

sources:
  - name: raw
    schema: raw
    # Freshness SLA for the hourly pipeline. The loader stamps one loaded_at
    # per (page_type, date, hour) batch, so max(loaded_at) is "when did the
    # last pull land". Hourly cadence + a retry window -> warn at 2h; a full
    # day without data is an incident -> error at 24h. Run with
    # `./deploy.sh source-freshness`.
    loaded_at_field: loaded_at
    freshness:
      warn_after: {count: 2, period: hour}
      error_after: {count: 24, period: hour}
    tables:
      - name: impressions
        description: "Raw impression events from web server API"
        columns:
          - name: user_id
            description: "UUID representing a unique user"
            tests:
              - not_null
          - name: impression_id
            description: "UUID for a unique impression (deterministic from user_id, page_type, date, hour, minute)"
            tests:
              - not_null
          - name: page_type
            description: "Page type enumeration: 1, 2, or 3"
            tests:
              - not_null
              - accepted_values:
                  values: [1, 2, 3]
          - name: date
            description: "Date in YYYY-MM-DD format"
            tests:
              - not_null
          - name: hour
            description: "Hour of the day (0-23)"
            tests:
              - not_null
          - name: min
            description: "Minute (0-59)"
          - name: second
            description: "Second (0-59)"
          - name: event_type
            description: "Funnel event type: a through f (sequential)"
            tests:
              - not_null
              - accepted_values:
                  values: ['a', 'b', 'c', 'd', 'e', 'f']
          - name: loaded_at
            description: "When the loader wrote the batch (UTC); freshness watermark"
            tests:
              - not_null

models:
  - name: stg_impressions
    description: "Staged impressions with cleaned types and derived timestamp"
    # Model contract: dbt checks the compiled SQL's column names and types
    # against this list *before* building, so a change in the source (a
    # retyped column, a dropped one) fails here with a clear diff instead of
    # silently changing every downstream table. Every column must be listed.
    config:
      contract:
        enforced: true
    columns:
      - name: user_id
        data_type: varchar
        tests:
          - not_null
      - name: impression_id
        data_type: varchar
        tests:
          - not_null
      - name: page_type
        data_type: integer
      - name: event_date
        data_type: date
        description: "Parsed event date; NULL means the source date was malformed"
        tests:
          - not_null:
              config:
                # Surface rows whose source date failed to parse. Warn (not
                # error) so a few bad rows flag the issue without blocking the
                # whole pipeline.
                severity: warn
      - name: hour
        data_type: integer
      - name: minute
        data_type: integer
      - name: second
        data_type: integer
      - name: event_type
        data_type: varchar
      - name: event_timestamp
        data_type: timestamp
        description: "Derived event timestamp; NULL if any time part is invalid"
      - name: loaded_at
        data_type: timestamptz
        description: "Batch load watermark carried through from the source"
