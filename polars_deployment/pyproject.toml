[project]
name = "polars-deployment"
version = "0.1.0"
description = "Polars as a single-node, in-process DataFrame engine over hive-partitioned Parquet for impression analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.44,<2",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
# The benchmark compares Polars against DuckDB reading the same Parquet files.
bench = [
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",  # duckdb -> polars hand-off
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polars_deployment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
