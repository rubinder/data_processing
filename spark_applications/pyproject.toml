[project]
name = "spark-applications"
version = "0.1.0"
description = "PySpark data processing jobs"
requires-python = ">=3.10"
dependencies = [
    "pyspark==3.5.4",
    "boto3>=1.35.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "delta-spark>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
